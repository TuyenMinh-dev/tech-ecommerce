quarkus.http.port=8084

# Package type: Uber-JAR for portable containerization
quarkus.package.jar.type=uber-jar

# SmallRye Reactive Messaging RabbitMQ Connector
mp.messaging.incoming.order-in.connector=smallrye-rabbitmq
mp.messaging.incoming.order-in.host=${RABBITMQ_HOST:localhost}
mp.messaging.incoming.order-in.port=${RABBITMQ_PORT:5672}
mp.messaging.incoming.order-in.username=${RABBITMQ_USERNAME:guest}
mp.messaging.incoming.order-in.password=${RABBITMQ_PASSWORD:guest}
mp.messaging.incoming.order-in.queue.name=order.created
mp.messaging.incoming.order-in.exchange.name=order.exchange
mp.messaging.incoming.order-in.routing-keys=order.created
mp.messaging.incoming.order-in.auto-acknowledgement=true

# Log configuration
quarkus.log.level=INFO
quarkus.log.category."com.haui.notification".level=DEBUG
